# Shared runtime and optimization configuration for all eight backbone experiments.
# Values are selected by the bounded throughput benchmark, never per backbone.
training:
  device: auto
  amp: true
  epochs: 20
  batch_size: 256
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cache_mode: hdf5
  learning_rate: 3.0e-05
  weight_decay: 0.0001
runtime:
  cudnn_benchmark: true
  cudnn_deterministic: false
  deterministic_algorithms: false
  allow_tf32: true
  float32_matmul_precision: high
